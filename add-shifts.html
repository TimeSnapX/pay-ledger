<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Chrona shifts · Pay Ledger</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f1419; color:#e8eef6; min-height:100vh; display:grid; place-items:center; margin:0; padding:24px; }
    .card { max-width:420px; background:#1a2332; border:1px solid #2d3a4f; border-radius:16px; padding:24px; }
    h1 { font-size:1.25rem; margin:0 0 8px; }
    p { color:#8b9bb4; line-height:1.45; }
    a.btn { display:block; text-align:center; margin-top:18px; padding:14px 16px; border-radius:12px; background:#3b82f6; color:#fff; font-weight:700; text-decoration:none; }
    ul { padding-left:1.1rem; color:#e8eef6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Add 2 BevChain shifts</h1>
    <p>Tap once on the same browser you use for Pay Ledger.</p>
    <ul>
      <li>Thu 17 Sep — 11h45 on site, 30m break</li>
      <li>Fri 18 Sep — 9h on site, 30m break</li>
    </ul>
    <a class="btn" id="go" href="#">Add to Pay Ledger</a>
  </div>
  <script>
    const payload = {
      shifts: [
        { date: "2026-09-17", workedHours: 11.75, breakMins: 30, rate: 41.21, dayType: "weekday", note: "Chrona: gate-to-gate" },
        { date: "2026-09-18", workedHours: 9, breakMins: 30, rate: 41.21, dayType: "weekday", note: "Chrona: gate-to-gate" },
      ],
    };
    document.getElementById("go").href =
      "./?chronaAdd=" + encodeURIComponent(JSON.stringify(payload)) + "#/hours";
  </script>
</body>
</html>
